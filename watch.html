<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AniVerse watch page. View official streaming options and episode choices for your selected anime."
    />
    <title>AniVerse | Watch Anime</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body data-page="watch">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="./index.html" class="brand" aria-label="AniVerse home">
          <span class="brand-mark">A</span>
          <span class="brand-text">AniVerse</span>
        </a>
        <nav class="main-nav" aria-label="Main navigation">
          <a href="./index.html#top-anime">Top Anime</a>
          <a href="./index.html#popular-anime">Popular</a>
          <a href="./index.html#upcoming-anime">Upcoming</a>
          <a href="./index.html#search-anime">Search</a>
        </nav>
        <div class="nav-actions">
          <button id="watchBackButton" class="nav-button secondary" type="button">Back</button>
        </div>
      </div>
    </header>

    <main class="watch-page">
      <div class="container">
        <div id="watchError" class="api-message error hidden" role="alert"></div>

        <section class="watch-shell">
          <div class="watch-player-panel">
            <div id="watchPlayer" class="watch-player">
              <div class="watch-placeholder">
                <div class="placeholder-icon">▶</div>
                <h2>Official streaming source required</h2>
                <p>
                  The Jikan API does not provide direct episode video streams. To watch legally,
                  use the official provider links below or visit an authorized service.
                </p>
              </div>
            </div>

            <div id="providerList" class="provider-list"></div>
          </div>

          <aside class="watch-sidebar">
            <div id="watchAnimeMeta" class="watch-meta"></div>
            <div class="episode-selector-block">
              <div class="section-heading inline-heading small-gap">
                <div>
                  <p class="eyebrow">Select Episode</p>
                  <h3>Episodes</h3>
                </div>
              </div>
              <div id="watchEpisodeList" class="watch-episode-list"></div>
            </div>
          </aside>
        </section>
      </div>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
